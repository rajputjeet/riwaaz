name: shaadi_hub
description: "ShaadiHub - Shaadi Ki Har Zaroorat, Ek Hi Jagah."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3
  flutter_rating_bar: ^4.0.1
  percent_indicator: ^4.2.3
  get: ^4.7.3
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  flutter_widget_from_html_core: ^0.17.4
  video_player: ^2.11.1
  chewie: ^1.15.0
  http: ^1.6.0
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/widoora_app_icon_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFF9F1"
  adaptive_icon_foreground: "assets/images/widoora_adaptive_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/images/widoora_app_icon_1024.png"
    background_color: "#790D16"
    theme_color: "#790D16"
  windows:
    generate: true
    image_path: "assets/images/widoora_app_icon_1024.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - assets/images/vendor_royal_click.jpg
    - assets/images/vendor_memories.jpg
    - assets/images/vendor_shutter.jpg
    - assets/images/vendor_candid.jpg
    - assets/images/vendor_lensart.jpg
    - assets/images/explore_decoration.jpg
    - assets/images/explore_catering.jpg
    - assets/images/explore_wedding_car.jpg
    - assets/images/vendor_detail_hero.jpg
    - assets/images/shaadihub_logo.jpg
    - assets/images/widoora_logo.png
    - assets/images/wedding_hero.jpg
    - assets/images/riwaaz_couple.png
    - assets/images/onboarding_welcome_couple.jpg
    - assets/images/onboarding_mandap.jpg
    - assets/images/onboarding_couple.png
    - assets/images/onboarding_outfits.png
    - assets/images/onboarding_car.png
    - assets/images/onboarding_camera.png
    - assets/images/onboarding_dhol.png
    - assets/images/onboarding_invitation.png
    - assets/images/onboarding_walk_couple.jpg
    - assets/images/onboarding_walk_couple.png
    - assets/images/onboarding_phone_mockup.png
    - assets/images/onboarding_mandap_stage.jpg
